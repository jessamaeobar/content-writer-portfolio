<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="View and download Jessa Mae Obar's professional resume. Content Writer specializing in research, editorial work, copy editing, proofreading, and SEO content.">

    <meta name="author" content="Jessa Mae Obar">

    <title>Resume | Jessa Mae Obar</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f5f7fa;
            color: #263238;
            line-height: 1.6;
        }

        /* Navigation */
        nav {
            background-color: #ffffff;
            padding: 18px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e5e7eb;
        }

        .logo {
            font-size: 18px;
            font-weight: 700;
            color: #1e3a5f;
            text-decoration: none;
        }

        nav a.back-link {
            color: #1e3a5f;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        nav a.back-link:hover {
            text-decoration: underline;
        }

        /* Main Content */
        .container {
            max-width: 1100px;
            margin: 55px auto;
            padding: 0 20px;
        }

        .resume-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .resume-header h1 {
            font-size: 32px;
            color: #1e3a5f;
            margin-bottom: 10px;
        }

        .resume-header p {
            color: #64748b;
            font-size: 15px;
            margin-bottom: 25px;
        }

        /* Buttons */
        .button-group {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .button {
            display: inline-block;
            padding: 12px 24px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: 0.2s ease;
        }

        .primary-button {
            background-color: #1e3a5f;
            color: #ffffff;
        }

        .primary-button:hover {
            background-color: #294f7a;
        }

        .secondary-button {
            background-color: #ffffff;
            color: #1e3a5f;
            border: 1px solid #1e3a5f;
        }

        .secondary-button:hover {
            background-color: #edf2f7;
        }

        /* PDF Viewer */
        .pdf-container {
            background-color: #ffffff;
            padding: 12px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            margin-top: 35px;
        }

        iframe {
            width: 100%;
            height: 850px;
            border: none;
            border-radius: 5px;
        }

        .pdf-fallback {
            text-align: center;
            padding: 25px;
            color: #64748b;
            font-size: 14px;
        }

        .pdf-fallback a {
            color: #1e3a5f;
            font-weight: 600;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 30px 15px;
            color: #64748b;
            font-size: 13px;
            margin-top: 40px;
        }

        footer a {
            color: #1e3a5f;
            text-decoration: none;
        }

        /* Mobile Responsiveness */
        @media (max-width: 768px) {

            nav {
                padding: 16px 5%;
            }

            .container {
                margin: 35px auto;
            }

            .resume-header h1 {
                font-size: 26px;
            }

            iframe {
                height: 650px;
            }

            .button {
                width: 100%;
                text-align: center;
            }
        }

    </style>
</head>

<body>

    <!-- Navigation -->
    <nav>
        <a href="./index.html" class="logo">
            Jessa Mae Obar
        </a>

        <a href="./index.html" class="back-link">
            ← Back to Portfolio
        </a>
    </nav>

    <!-- Resume Section -->
    <main class="container">

        <section class="resume-header">

            <h1>My Resume</h1>

            <p>
                Content Writer | Research & Editorial |
                Copy Editing & Proofreading
            </p>

            <div class="button-group">

                <!-- Download Resume -->
                <a
                    href="./Obar_Jessa_Mae_Resume.pdf"
                    class="button primary-button"
                    download="Jessa-Mae-Obar-Resume.pdf">

                    ↓ Download Resume (PDF)

                </a>

                <!-- Open PDF in New Tab -->
                <a
                    href="./Obar_Jessa_Mae_Resume.pdf"
                    class="button secondary-button"
                    target="_blank"
                    rel="noopener noreferrer">

                    View PDF in New Tab

                </a>

            </div>

        </section>

        <!-- Embedded PDF Preview -->
        <section class="pdf-container">

            <iframe
                src="./Obar_Jessa_Mae_Resume.pdf"
                title="Jessa Mae Obar - Professional Resume"
                loading="lazy">

                Your browser does not support embedded PDFs.

                <a href="./Obar_Jessa_Mae_Resume.pdf">
                    Click here to view my resume.
                </a>

            </iframe>

            <div class="pdf-fallback">

                Having trouble viewing the document?

                <a href="./Obar_Jessa_Mae_Resume.pdf">
                    Open or download my resume here.
                </a>

            </div>

        </section>

    </main>

    <!-- Footer -->
    <footer>

        <p>
            © 2026 Jessa Mae Obar. All rights reserved.
        </p>

        <p>
            <a href="./index.html">Back to Portfolio</a>
        </p>

    </footer>

</body>
</html>
