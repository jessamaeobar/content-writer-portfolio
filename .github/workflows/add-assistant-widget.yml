name: Install assistant widget

on:
  push:
    paths:
      - 'assistant-widget-install.trigger'

permissions:
  contents: write

jobs:
  install:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install loader into homepage
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          loader = '<script src="assistant-widget-loader.js"></script>'
          if loader not in text:
              marker = '</body>'
              if marker not in text:
                  raise SystemExit('Could not find </body> in index.html')
              text = text.replace(marker, f'{loader}\n{marker}', 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Remove trigger
        run: rm -f assistant-widget-install.trigger

      - name: Commit homepage update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assistant-widget-install.trigger
          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "Load floating portfolio assistant on homepage"
            git push
          fi
